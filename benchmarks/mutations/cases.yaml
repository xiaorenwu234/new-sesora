# 受控缺陷注入案例库（方案 §8）。
# 每案例：注入位置(file+mutation)、触发条件(trigger)、Oracle、预期状态、
# 恢复方式（runner 通过 git checkout 还原 + 可选 kubectl apply）。
# layer=manifest 的案例可自动 apply/revert/deploy；layer=source 需重建镜像。
# expected_state=COMPLIANT 的为负样本（正确/加固配置），用于检验误报。
#
# mutation 语法：
#   op: set/delete  path: 点分路径（支持 [n] 索引）  value: set 时的值

# ---------- 缺陷案例（VIOLATED） ----------
- id: MUT-001
  contract_id: RES-004
  target: emailservice
  layer: manifest
  file: kubernetes-manifests/emailservice.yaml
  expected_state: VIOLATED
  description: 移除 readinessProbe，滚动更新/故障时流量路由到未就绪 Pod
  trigger: Pod 重启或滚动更新期间承接流量
  oracle: {type: slo_violation, metric: error_rate}
  mutation: {op: delete, path: "spec.template.spec.containers[0].readinessProbe"}

- id: MUT-002
  contract_id: RES-004
