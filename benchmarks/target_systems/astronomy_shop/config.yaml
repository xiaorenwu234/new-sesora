# Astronomy Shop（OpenTelemetry Demo）评估配置 overlay。
# 用法：python cli.py assess --config benchmarks/target_systems/astronomy_shop/config.yaml \
#         --profile benchmarks/systems/astronomy_shop.yaml
# 部署：先运行同目录 deploy.sh 拉起完整 Astronomy Shop。
system_id: astronomy-shop

source:
  repo_path: /home/xueht/opentelemetry-demo
  commit: null
  languages: [python, go, java, javascript, csharp, ruby, php, rust, cpp]

kubernetes:
  kubeconfig: /home/xueht/new-sesora/kubeconfig
  namespace: otel-demo
  manifest_dir: /home/xueht/opentelemetry-demo/kubernetes

runtime:
  jaeger_url: http://192.168.5.51:31686/jaeger/ui
  prometheus_url: http://192.168.5.51:31090
  lookback: 1h
  trace_limit: 200

neo4j:
  uri: bolt://127.0.0.1:7687
  user: neo4j
  password: cnaa-research-2026
  database: neo4j

llm:
  base_url: http://127.0.0.1:8000/v1
  api_key_env: CNAA_LLM_API_KEY
  model: qwen3.8-27b
  temperature: 0.1
  enable_thinking: true

workload:
  frontend_url: http://192.168.5.51:31217   # deploy.sh 暴露的 frontend NodePort
  locust_file: benchmarks/workloads/astronomy_workload.py
  users: 20
  spawn_rate: 5
  duration_s: 120

budget:
  max_experiments: 8
  max_wall_time_s: 3600
  max_tokens: 200000
  lambda_cost: 0.15
  mu_risk: 0.30

safety:
  allowed_namespaces: [otel-demo]
  allowed_actions:
    - POD_TERMINATION
    - NETWORK_DELAY
    - NETWORK_LOSS
    - CPU_PRESSURE
    - MEMORY_PRESSURE
    - DEPENDENCY_UNAVAILABLE
    - LOAD_VARIATION
    - OBSERVATION_ONLY
  max_fault_duration_s: 180
  max_affected_pods: 1
  protected_services: [astronomy-db, valkey-cart, kafka, opensearch, flagd,
                       load-generator, jaeger, otel-collector]
  require_baseline: true
  require_recovery_check: true

slo_file: benchmarks/slo/astronomy_slo.yaml
output_dir: runs