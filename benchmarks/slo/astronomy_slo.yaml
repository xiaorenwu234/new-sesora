# Astronomy Shop 冻结 SLO（RQ5 跨系统评估，实验前确定）
global:
  restart_max: 0
  recovery_time_s_max: 60
  amplification_max: 3.0
  invariant_violations_max: 0
  broken_trace_ratio_max: 0.05
  error_signal_required: true
  metric_series_required: true
  localization_accuracy_min: 0.8
  scaling_gain_min: 1.5

