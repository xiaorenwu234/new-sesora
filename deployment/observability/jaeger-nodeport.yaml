# 复用 otel-demo 命名空间已有的 Jaeger all-in-one（OTLP gRPC 4317 已启用）。
# 仅新增一个 NodePort Service 暴露查询 API 给评估系统，不改动原有组件。
apiVersion: v1
kind: Service
metadata:
  name: jaeger-cnaa-query
  namespace: otel-demo
  labels:
    app.kubernetes.io/managed-by: cnaa
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: all-in-one
    app.kubernetes.io/instance: otel-demo
    app.kubernetes.io/name: jaeger
  ports:
    - name: query
      port: 16686
      targetPort: 16686
      nodePort: 31686