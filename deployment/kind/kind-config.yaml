# kind 隔离测试集群（方案 §11：测试环境用 kind 创建隔离 K8s）。
# 创建：KIND_EXPERIMENTAL_PROVIDER=podman kind create cluster --config kind-config.yaml
# extraPortMappings 将 NodePort 映射到宿主机，供 Jaeger/Prometheus/frontend 访问。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cnaa
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 31686   # Jaeger query
        hostPort: 31686
        protocol: TCP
      - containerPort: 31090   # Prometheus
        hostPort: 31090
        protocol: TCP
      - containerPort: 31216   # Online Boutique frontend
        hostPort: 31216
        protocol: TCP
      - containerPort: 31217   # Astronomy Shop frontend
        hostPort: 31217
        protocol: TCP
  - role: worker
  - role: worker